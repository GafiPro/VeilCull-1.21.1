name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle build --no-daemon --max-workers=1

      - name: Stage and verify server mod
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          MAIN_JAR="$(find build/libs -maxdepth 1 -type f -name 'veilcull-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$MAIN_JAR"
          cp "$MAIN_JAR" dist/VeilCull-1.21.1-server.jar
          jar tf dist/VeilCull-1.21.1-server.jar | grep -Fx 'me/gafipro/veilcull/VeilCull.class'
          jar tf dist/VeilCull-1.21.1-server.jar | grep -Fx 'veilcull.mixins.json'
          unzip -p dist/VeilCull-1.21.1-server.jar fabric.mod.json | grep -F '"id": "veilcull"'
          if jar tf dist/VeilCull-1.21.1-server.jar | grep -q -- '-sources.jar'; then
            echo "Source archive must not be nested in the runtime JAR."
            exit 1
          fi

      - name: Upload server mod only
        uses: actions/upload-artifact@v4
        with:
          name: VeilCull-1.21.1-server
          path: dist/VeilCull-1.21.1-server.jar
          if-no-files-found: error
          retention-days: 30
